# https://chat.openai.com/share/4c492b9e-12aa-4a0c-b68d-a0a3f93ab6e9

name: Flutter CI

on:
  push:
    branches:
      - develop
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v2

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.5'

    - name: Install dependencies
      working-directory: ./music_interval_trainer
      run: flutter pub get

    - name: Build for Android
      working-directory: ./music_interval_trainer
      run: flutter build apk

    - name: Run tests
      working-directory: ./music_interval_trainer
      run: flutter test

  build-ios:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v2

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.5'

    - name: Install dependencies
      working-directory: ./music_interval_trainer
      run: flutter pub get

    - name: Install certificate
      run: |
        echo "${{ secrets.IOS_CERTIFICATE_P12 }}" | base64 --decode > certificate.p12
        security create-keychain -p "" build.keychain
        security import certificate.p12 -k ~/Library/Keychains/build.keychain -P "${{ secrets.IOS_CERTIFICATE_PASSWORD }}"
        security list-keychains -s ~/Library/Keychains/build.keychain
        security default-keychain -s ~/Library/Keychains/build.keychain

    - name: Build for iOS
      working-directory: ./music_interval_trainer
      run: flutter build ios

    - name: Run tests
      working-directory: ./music_interval_trainer
      run: flutter test
