name: Flutter CI

on:
  push:
    branches:
      - main

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v2

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    - name: Install dependencies
      working-directory: ./music_interval_trainer
      run: flutter pub get

    - name: Build for Android
      working-directory: ./music_interval_trainer
      run: flutter build apk

    - name: Run tests
      working-directory: ./music_interval_trainer
      run: flutter test

  ios:
